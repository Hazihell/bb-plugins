name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned bb CLI
        run: bun install -g "bb-app@$(node -p "require('./package.json').config.bbVersion")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check vendored SDK types against pinned bb
        run: bun run sdk-types:check

      - name: Check generated plugin icons
        run: bun run icons:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # scripts/build-plugin.ts points bb.server/bb.app at the sources for the
      # length of a build and restores the published manifest afterwards, so a
      # dirty package.json here means a build left the swap behind.
      - name: Guard against build mutating vendored types or manifests
        run: git diff --exit-code -- 'plugins/*/types/*.d.ts' 'plugins/*/package.json'

      # Packs every publishable plugin and checks the manifest's bb.* paths
      # against the tarball's contents. bb stats those paths at install time,
      # so an allowlist that omits one ships a package that installs nowhere.
      - name: Check the publishable tarballs
        run: bun run publish:dry
